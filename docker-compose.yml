services:

 postgres:

  image: postgres:15

  container_name:
   flowboard-postgres

  restart: always

  environment:

   POSTGRES_USER:
    postgres

   POSTGRES_PASSWORD:
    postgres

   POSTGRES_DB:
    flowboard

  ports:

   - "5432:5432"

  volumes:

   - pgdata:/var/lib/postgresql/data


 redis:

  image: redis:7

  container_name:
   flowboard-redis

  restart: always

  ports:

   - "6379:6379"


 app:

  build:
   context: .

  container_name:
   flowboard-api

  ports:

   - "3000:3000"

  depends_on:

   - postgres

   - redis

  environment:

   DATABASE_URL:
    postgresql://postgres:postgres@postgres:5432/flowboard

   REDIS_HOST:
    redis

   REDIS_PORT:
    6379


volumes:

 pgdata: